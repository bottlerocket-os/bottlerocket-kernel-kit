[package]
name = "kernel-next"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[package.metadata.build-package]
package-name = "kernel-next"
module-signing = true

[lib]
path = "../packages.rs"

[[package.metadata.build-package.external-files]]
# Use latest-kernel-srpm-url.sh to get this.
url = "https://cdn-al2027.amazonlinux.com/blobstore/ac703f4a3960f4ec0af0d0b453da6bc8cf278c42cb9d514362c3fdc42196cc1a/kernel7.2-7.2.13-18.154.amzn2027.src.rpm"
sha512 = "12e69ca74ebd3115f23e55d6d2596b80cf65861f0796b95f74b6e4c57fb4be539f8f5e1d6867e22bc3122ad6de6624db6c0debb3f728b3ce8bc9844f1f7e8269"
force-upstream = true

# This kernel builds no Neuron drivers, because the target instances
# have NVIDIA GPUs only.

[build-dependencies]
microcode = { path = "../microcode" }
